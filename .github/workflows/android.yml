name: Android app (Vivid Pulse)

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'LICENSE', '**/*.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

# Build numbers carry on from the builds made before the app moved here (they reached 5).
env:
  BUILD_OFFSET: 100

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and its build tags, for the changelog.
          fetch-depth: 0

      - name: Changelog (every build and what it changed, for the app's Changelog page)
        run: |
          mkdir -p dist
          python3 ci/changelog.py $((GITHUB_RUN_NUMBER + BUILD_OFFSET)) app/src/main/assets/changelog.json
          cp app/src/main/assets/changelog.json dist/changelog.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # GSMArena's real pages for one phone, so the unit tests check the app still reads them.
      - name: Fetch a GSMArena page for the tests
        continue-on-error: true
        run: |
          mkdir -p ci-gsm
          UA="Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36"
          curl -sSL -m 30 -A "$UA" -o ci-gsm/search.html "https://www.gsmarena.com/results.php3?sQuickSearch=yes&sName=vivo+X200+Ultra" || true
          curl -sSL -m 30 -A "$UA" -o ci-gsm/phone.html "https://www.gsmarena.com/vivo_x200_ultra-13762.php" || true
          ls -la ci-gsm
          DESKTOP="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sSL -m 30 -A "$DESKTOP" -o ci-gsm/search-desktop.html "https://www.gsmarena.com/results.php3?sQuickSearch=yes&sName=vivo+X200+Ultra" || true
          curl -sSL -m 30 -A "$UA" -o ci-gsm/search-short.html "https://www.gsmarena.com/results.php3?sQuickSearch=yes&sName=x200+ultra" || true
          curl -sSL -m 30 -A "$DESKTOP" -o ci-gsm/home.html "https://www.gsmarena.com/" || true
          for f in ci-gsm/search*.html; do
            echo "--- $f: $(wc -c < $f) bytes, title: $(grep -o '<title>[^<]*' $f)"
            grep -oE 'href="[^"]*x200[^"]*"' -i $f | sort -u | head -10
            grep -n -i -E 'makers|no results|not found|x200' $f | head -12 | cut -c1-300
          done
          echo "--- quick search data the site's search box uses:"
          grep -oE 'quicksearch-[0-9]+\.jpg' ci-gsm/home.html | head -3
          QS=$(grep -oE 'quicksearch-[0-9]+\.jpg' ci-gsm/home.html | head -1)
          [ -n "$QS" ] && curl -sSL -m 30 -A "$DESKTOP" "https://www.gsmarena.com/$QS" | head -c 600; echo
          rm -f ci-gsm/home.html
          echo "--- specs on the phone page:"; grep -oE 'data-spec="[a-z0-9]+"[^>]*>[^<]{0,160}' ci-gsm/phone.html | head -60

      - name: Unit tests and release APK
        run: |
          chmod +x gradlew
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + BUILD_OFFSET))
          ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/VividPulse-1.0.$((GITHUB_RUN_NUMBER + BUILD_OFFSET)).apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vivid-pulse-apk
          path: |
            dist/*.apk
            dist/changelog.json

      # The same app numbered build 1, so the emulator test can watch the in-app updater find
      # the newest build on the release page, download it and open the installer.
      - name: Build an old-numbered copy for the updater test
        env:
          VERSION_CODE: 1
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p dist-old
          cp app/build/outputs/apk/release/app-release.apk dist-old/VividPulse-old.apk

      - uses: actions/upload-artifact@v4
        with:
          name: vivid-pulse-old-apk
          path: dist-old/*.apk

  # Vivid Pulse PC, the Windows program the app's PC tab talks to: built, run for real against a
  # pretend Steam install, then zipped for the release page.
  pc-companion:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build Vivid Pulse PC
        run: dotnet build pc/VividPulsePC -c Release -nologo

      - name: Check how it reads Steam's files
        run: dotnet run --project pc/VividPulsePC.Tests -c Release

      - name: Run Vivid Pulse PC and ask it everything the app asks
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File ci\pc-test.ps1 -Exe pc\VividPulsePC\bin\Release\net472\VividPulsePC.exe

      - name: Check what it sent
        if: always()
        run: python ci/check-pc-output.py pc-out

      - name: Zip it
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "Vivid Pulse PC" | Out-Null
          Copy-Item pc\VividPulsePC\bin\Release\net472\VividPulsePC.exe, pc\VividPulsePC\bin\Release\net472\VividPulsePC.exe.config, pc\README.txt "Vivid Pulse PC"
          Get-ChildItem "Vivid Pulse PC" | Format-Table Name, Length
          Compress-Archive -Path "Vivid Pulse PC" -DestinationPath VividPulsePC.zip -Force
          Get-Item VividPulsePC.zip | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: vivid-pulse-pc
          path: VividPulsePC.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-samples
          path: pc-out

  emulator-test:
    needs: [build, pc-companion]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vivid-pulse-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: vivid-pulse-old-apk
          path: dist-old

      # What Vivid Pulse PC sent on the Windows runner, for the PC tab to show as well.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pc-samples
          path: pc-real

      - name: What the game stores answer (for checking the app's parsers)
        continue-on-error: true
        run: |
          probe() { echo "--- $1"; curl -sS -m 20 -A "VividPulse-CI" "$1" | head -c "${2:-700}"; echo; }
          probe "https://api.steampowered.com/ISteamChartsService/GetMostPlayedGames/v1/"
          probe "https://api.steampowered.com/ISteamUserStats/GetNumberOfCurrentPlayers/v1/?appid=730"
          probe "https://api.steampowered.com/ISteamChartsService/GetGamesByConcurrentPlayers/v1/" 600
          # Games on the most played chart that Steam's per-game count calls 0 or doesn't answer for.
          curl -sS -m 30 "https://api.steampowered.com/ISteamChartsService/GetMostPlayedGames/v1/" | python3 -c '
          import json, sys, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          ranks = json.load(sys.stdin)["response"]["ranks"]
          def count(a):
              try:
                  r = json.load(urllib.request.urlopen(f"https://api.steampowered.com/ISteamUserStats/GetNumberOfCurrentPlayers/v1/?appid={a}", timeout=20))["response"]
                  return r.get("player_count") if r.get("result") == 1 else "result " + str(r.get("result"))
              except Exception as e:
                  return f"failed: {e}"
          with ThreadPoolExecutor(8) as ex:
              counts = list(ex.map(lambda r: count(r["appid"]), ranks))
          odd = [(r["rank"], r["appid"], r.get("peak_in_game"), c) for r, c in zip(ranks, counts) if not isinstance(c, int) or c == 0]
          print(f"--- per-game player counts: {len(ranks) - len(odd)} of {len(ranks)} fine; 0 or missing:", odd)
          ' || echo "(per-game check failed)"
          probe "https://api.steampowered.com/IStoreBrowseService/GetItems/v1/?input_json=%7B%22ids%22%3A%5B%7B%22appid%22%3A730%7D%5D%2C%22context%22%3A%7B%22language%22%3A%22english%22%2C%22country_code%22%3A%22GB%22%2C%22steam_realm%22%3A1%7D%2C%22data_request%22%3A%7B%22include_assets%22%3Atrue%2C%22include_basic_info%22%3Atrue%7D%7D" 1500
          probe "https://api.steampowered.com/IStoreTopSellersService/GetWeeklyTopSellers/v1/?input_json=%7B%22country_code%22%3A%22GB%22%2C%22context%22%3A%7B%22language%22%3A%22english%22%2C%22country_code%22%3A%22GB%22%2C%22steam_realm%22%3A1%7D%2C%22data_request%22%3A%7B%22include_assets%22%3Atrue%2C%22include_basic_info%22%3Atrue%7D%2C%22page_start%22%3A0%2C%22page_count%22%3A3%7D" 1500
          probe "https://store.steampowered.com/api/featuredcategories?cc=GB&l=english" 1200
          probe "https://www.valvesoftware.com/about/stats"
          probe "https://store.steampowered.com/api/storesearch/?term=elden%20ring&l=english&cc=GB" 900
          search() { # a store search page: how many results, rows and the first games on it
            echo "--- store search: $1"
            curl -sS -m 30 -A "VividPulse-CI" "https://store.steampowered.com/search/results/?$1&category1=998&start=0&count=50&infinite=1&cc=GB&l=english" \
              | python3 -c 'import json,re,sys; o=json.load(sys.stdin); h=o.get("results_html",""); ids=re.findall(r"data-ds-appid=\"(\d+)\"",h); print("total", o.get("total_count"), "rows", h.count("class=\"search_result_row"), "games", len(ids), ids[:8])' \
              || echo "(failed)"
          }
          search "specials=1&filter=topsellers"
          search "filter=popularwishlist"
          search "filter=popularcomingsoon"
          search "maxprice=free&specials=1"
          # Reviews and release dates from GetItems: a released game and an upcoming one.
          items='{"ids":[{"appid":1086940},{"appid":2215430}],"context":{"language":"english","country_code":"GB","steam_realm":1},"data_request":{"include_assets":true,"include_basic_info":true,"include_release":true,"include_reviews":true}}'
          probe "https://api.steampowered.com/IStoreBrowseService/GetItems/v1/?input_json=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$items")" 4000
          probe "https://speed.cloudflare.com/meta" 600
          probe "https://speed.cloudflare.com/cdn-cgi/trace" 400

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back emulated -camera-front emulated
          script: PC_REAL=pc-real bash ci/smoke-test.sh "$(ls dist/*.apk | head -1)" screenshots "$(ls dist-old/*.apk | head -1)"

      - name: Pack screenshots
        if: always()
        run: |
          mkdir -p screenshots
          cd screenshots && zip -q -r ../screenshots.zip . && cd .. && ls -la screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vivid-pulse-screenshots
          path: screenshots.zip

      - name: Screenshot previews (base64, for reviewing from the log)
        if: always()
        run: bash ci/thumbnails.sh screenshots

  # Every page on the oldest Android the app supports and on a tablet, so it works on any phone,
  # not just the newest.
  compat-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: android-8
            api: 26
            profile: pixel_2
          - name: tablet
            api: 34
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vivid-pulse-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open every page (${{ matrix.name }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash ci/quick-test.sh "$(ls dist/*.apk | head -1)" compat-${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-${{ matrix.name }}
          path: compat-${{ matrix.name }}

  publish:
    needs: [build, emulator-test, pc-companion, compat-test]
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: vivid-pulse-latest
      NOTES: ${{ github.event.head_commit.message }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vivid-pulse-apk
          path: dist

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vivid-pulse-screenshots
          path: shots

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vivid-pulse-pc
          path: pc

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: compat-*
          path: compat

      - name: Publish pre-release with the APK
        run: |
          BUILD=$((GITHUB_RUN_NUMBER + BUILD_OFFSET))
          cp dist/*.apk VividPulse.apk
          # This build's changelog entry: everything since the last published build, which is the
          # app's "What's new" list.
          ENTRY=$(jq -c --argjson b "$BUILD" '[.entries[] | select(.code == $b)][0] // {}' dist/changelog.json)
          TITLE=$(jq -r '.title // empty' <<< "$ENTRY")
          [ -n "$TITLE" ] || TITLE="${NOTES%%$'\n'*}"
          CHANGES=$(jq -r '(.changes // []) | map("- " + .) | join("\n")' <<< "$ENTRY")
          UPDATE_SIZE=$(jq -r '.size // "small"' <<< "$ENTRY")
          # Read by the app's updater: build number plus a checksum it verifies after download.
          jq -n --argjson code "$BUILD" --arg name "1.0.$BUILD" \
            --arg sha "$(sha256sum VividPulse.apk | cut -d' ' -f1)" --argjson size "$(stat -c %s VividPulse.apk)" \
            --arg notes "$TITLE" --arg changes "$CHANGES" --arg updateSize "$UPDATE_SIZE" --arg commit "${GITHUB_SHA::7}" \
            '{versionCode: $code, versionName: $name, apk: "VividPulse.apk", sha256: $sha, size: $size, notes: $notes, changes: $changes, updateSize: $updateSize, commit: $commit}' > version.json
          cat version.json
          cp dist/changelog.json changelog.json
          files="VividPulse.apk version.json changelog.json"
          # The emulator test's screenshots, plus the other devices' in a folder each.
          mkdir -p allshots
          if [ -f shots/screenshots.zip ]; then (cd allshots && unzip -q ../shots/screenshots.zip); fi
          if [ -d compat ]; then cp -r compat/* allshots/ 2>/dev/null || true; fi
          if [ -n "$(ls -A allshots)" ]; then (cd allshots && zip -q -r ../screenshots.zip .); files="$files screenshots.zip"; fi
          if [ -f pc/VividPulsePC.zip ]; then cp pc/VividPulsePC.zip VividPulsePC.zip; files="$files VividPulsePC.zip"; fi
          cat > notes.md <<NOTES
          **Vivid Pulse for Android – build $BUILD** (\`${GITHUB_SHA::7}\`, emulator test: ${{ needs.emulator-test.result }})

          Your phone's vitals live – CPU, RAM, GPU, battery, heat, network and storage – plus full specs, Steam's charts and deals with prices from other stores, a charging companion, home screen widgets, Private DNS, an internet speed test and screen/touch tests.

          ### Install on your phone
          1. On your phone, open this page and tap **VividPulse.apk** to download it.
          2. Open the downloaded file. If asked, allow your browser or file manager to *install unknown apps*.
          3. Tap **Install**, then open **Vivid Pulse**.

          Already have Vivid Pulse? It checks this page when it opens and offers the update itself.

          ### Vivid Pulse PC (for the app's PC tab)
          On your Windows PC, download **VividPulsePC.zip**, unzip it and open **VividPulsePC**. Then on your phone open **PC › Find my PC** and type the code it shows. Your phone then sees the PC's specs, live CPU/GPU/RAM use and your Steam library (Purchased and Installed).

          \`screenshots.zip\` has previews from the automated emulator test.
          NOTES
          # The release is updated in place (never deleted first), so a failure can't leave the
          # download page and the in-app updater with nothing.
          TITLE_LINE="Vivid Pulse for Android (build $BUILD)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # version.json goes last: the updater only sees the new build once its APK is up.
            others=$(echo $files | tr ' ' '\n' | grep -v '^version.json$' | tr '\n' ' ')
            ok=1
            gh release upload "$TAG" $others --repo "$GITHUB_REPOSITORY" --clobber || ok=0
            [ $ok = 1 ] && { gh release upload "$TAG" version.json --repo "$GITHUB_REPOSITORY" --clobber || ok=0; }
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE_LINE" --notes-file notes.md --prerelease || true
            # Point the release's tag at this build's commit too.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true > /dev/null || true
          else
            ok=1
            gh release create "$TAG" $files --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "$TITLE_LINE" --notes-file notes.md || ok=0
          fi
          if [ $ok != 1 ]; then
            echo "::warning::Couldn't publish the release. The APK is attached to this run as the vivid-pulse-apk artifact."
            exit 1
          fi
          # Marks which commit this build was made from, so the next changelog knows where it starts.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v1.0.$BUILD" -f sha="$GITHUB_SHA" > /dev/null \
            || echo "::warning::Couldn't tag build $BUILD"
